AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  HandleEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: main.handler
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: http://host.docker.internal:4566
          DYNAMO_REPORTS_TABLE: saeb_reports_local
      Events:
        GetReportStatus:
          Type: HttpApi
          Properties:
            Path: /report/status
            Method: get
            RequestParameters:
              - method.request.querystring.filekey:
                  Required: true
                  Caching: true
